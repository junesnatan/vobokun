<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <script>
      if (localStorage.getItem('suv_theme') === 'light') {
        document.documentElement.classList.add('light');
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vobokun | Showroom SUV d'exception</title>
    
    <!-- Google Fonts: Montserrat (Geometrics Headers) & Plus Jakarta Sans (Readable Premium Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Dynamic SPA Styles -->
    <link rel="stylesheet" href="/src/styles/main.css">
  </head>
  <body class="font-sans min-h-screen flex flex-col antialiased selection:bg-suv-red selection:text-white overflow-x-hidden relative">
    
    <!-- Fixed luxury ambient backdrop glow spots -->
    <div class="fixed -top-40 -left-40 w-[500px] h-[500px] rounded-full bg-[#92000A]/5 blur-[160px] pointer-events-none z-0"></div>
    <div class="fixed top-1/3 right-[-10%] w-[600px] h-[600px] rounded-full bg-[#4A0040]/8 blur-[180px] pointer-events-none z-0"></div>
    <div class="fixed -bottom-40 left-1/3 w-[500px] h-[500px] rounded-full bg-[#FFB74D]/3 blur-[160px] pointer-events-none z-0"></div>
    
    <!-- Sticky Glassmorphism Header -->
    <div id="navbar-view" class="relative z-50"></div>
    
    <!-- Main Content Shell with Transition -->
    <main id="router-view" class="flex-grow pt-28 pb-16 px-4 md:px-8 max-w-7xl mx-auto w-full transition-all duration-300 ease-out relative z-10"></main>
    
    <!-- Global Footer -->
    <footer id="footer-view" class="relative z-10"></footer>

    <!-- Global Chat Widget Container -->
    <div id="global-chat-view" class="relative z-50"></div>

    <!-- App Entrypoint Script -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
